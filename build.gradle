plugins {
    id 'fabric-loom' version "${loom_version}"
}

// Jedna era Minecrafta = jeden jar. Roznice API siedza w src/compat/<era>/Compat.java,
// era przychodzi z -Pcompat_era (matryca w tools/build_all.py).
def era = (project.findProperty('compat_era') ?: 'mc21') as String
def javaVer = ((project.findProperty('java_version') ?: '21') as String) as int

version = project.mod_version
group = project.maven_group

base {
    // Nazwa pliku niesie silnik i wersje gry - sama wersja moda nie mowi, na czym jar
    // pojdzie, a mod jest przywiazany do konkretnego wydania Minecrafta.
    def mcRange = (project.findProperty('mc_range') ?: project.minecraft_version) as String
    archivesName = "${project.archives_base_name}-fabric-${mcRange}"
}

sourceSets.main.java.srcDir "src/compat/${era}/java"

dependencies {
    // Galaz dla wydan 1.20-1.21.x: Minecraft jest tu jeszcze obfuskowany, wiec sa
    // mapowania i remap zaleznosci. ID pluginu MUSI byc 'fabric-loom' - alias
    // 'net.fabricmc.fabric-loom' wlacza w Loomie tryb bez obfuskacji (dla 26.x).
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def ver = project.version
    inputs.property 'version', ver
    def mcDepend = (project.findProperty('mc_depend') ?: '>=1.21.5 <1.21.11') as String
    inputs.property 'mc_depend', mcDepend
    inputs.property 'java_depend', javaVer
    filesMatching('fabric.mod.json') {
        expand version: ver, mc_depend: mcDepend, java_depend: javaVer
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVer)
    targetCompatibility = JavaVersion.toVersion(javaVer)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVer
    it.options.encoding = 'UTF-8'
}

// Sprawdzenie logiki, ktora da sie policzyc bez serwera: liczniki, format czasu,
// zapis/odczyt stanu. `./gradlew selfTest` - wyjatek = test nie przeszedl.
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.kajor.bossrun.SelfTest'
}
