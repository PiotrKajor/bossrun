plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Jedna era Minecrafta = jeden jar. Roznice API siedza w src/compat/<era>/Compat.java,
// era przychodzi z -Pcompat_era (matryca w tools/build_all.py).
def era = (project.findProperty('compat_era') ?: 'mc26') as String

version = project.mod_version
group = project.maven_group

base {
    // Nazwa pliku niesie silnik i wersje gry - sama wersja moda nie mowi, na czym jar
    // pojdzie, a mod jest przywiazany do konkretnego wydania Minecrafta.
    def mcRange = (project.findProperty('mc_range') ?: project.minecraft_version) as String
    archivesName = "${project.archives_base_name}-fabric-${mcRange}"
}

sourceSets.main.java.srcDir "src/compat/${era}/java"

dependencies {
    // MC 26.x jest wydawany bez obfuskacji - dlatego zadnego bloku 'mappings'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def ver = project.version
    // Ten sam plik obsluguje wszystkie ery - zakres zaleznosci przychodzi z parametru.
    def mcDepend = (project.findProperty('mc_depend') ?: '~26.2') as String
    def javaDepend = (project.findProperty('java_version') ?: '25') as String
    // Loader 0.19.3 wymagany jest tylko przez 26.x; na starszych wydaniach gracze maja
    // 0.15-0.17 i taki wymog wywalilby moda przy starcie, zanim cokolwiek by sie wczytalo.
    def loaderDepend = (project.findProperty('loader_depend') ?: '>=0.19.3') as String
    inputs.property 'version', ver
    inputs.property 'mc_depend', mcDepend
    inputs.property 'java_depend', javaDepend
    inputs.property 'loader_depend', loaderDepend
    // Mixin odrzuca poziom zgodnosci, ktorego nie zna - JAVA_25 wywala moda na 1.20.x
    // zanim cokolwiek sie wczyta, wiec poziom jedzie z ta sama wartoscia co java_depend.
    filesMatching(['fabric.mod.json', 'bossrun.mixins.json']) {
        expand version: ver, mc_depend: mcDepend, java_depend: javaDepend,
                loader_depend: loaderDepend
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

// Sprawdzenie logiki, ktora da sie policzyc bez serwera: liczniki, format czasu,
// zapis/odczyt stanu. `./gradlew selfTest` - wyjatek = test nie przeszedl.
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.kajor.bossrun.SelfTest'
}
